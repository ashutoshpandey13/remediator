apiVersion: apps/v1
kind: Deployment

metadata:
  name: vulnerable-nginx
  namespace: secure-namespace

spec:
  replicas: 1

  selector:
    matchLabels:
      app: vulnerable-nginx

  template:
    metadata:
      labels:
        app: vulnerable-nginx

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: nginx:1.24.0
        ports:
        - containerPort: 8080

        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "250m"
            memory: "128Mi"

        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          runAsUser: 10001
          runAsGroup: 10001
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault